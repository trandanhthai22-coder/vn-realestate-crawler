# Vinhomes Global Gate (Cổ Loa, Đông Anh) — 4 dự án cao tầng, nguồn batdongsan.com.vn
# (thay cho phần BatdongsanScraper trong Data_Crawler.py; bản guland.vn: vhgg_global_gate_guland.toml)
#
#   Imperia Signature (MIK): The Continental = tòa Y4, Y5 ; The Cosmopolitan = tòa M1, M2, M3
name = "VHGG · Global Gate (batdongsan)"
mode = "apartment"
benchmark = "Vinhomes Global Gate"
output = "vhgg_global_gate_batdongsan"
zone_order = ["Masteri Grand Avenue", "Lumiere Essence Peak", "Lumiere Prime Hills",
              "The Continental", "The Cosmopolitan", "Imperia Signature"]

[crawl]
days_back = 30
max_pages = 30

# Tòa chung: "tòa A2", "toà b2", "tháp B1", "block A2" (so khớp không dấu)
[tower_options]
accent_insensitive = true
[[towers]]
pattern = '\b(?:toa|thap|block|building|tower)\s*[:\-]?\s*([a-z]{1,2}\s?\d{1,2})\b'
# Không ghi "tòa" -> suy từ mã căn dạng A2-42-01 / B2.15.02
[[towers]]
pattern = '\b([a-z]{1,2}\d?)\s*[-.]\s*\d{1,3}\s*[-.]\s*\d{1,3}\b'
fallback = true

[[projects]]
name = "Masteri Grand Avenue"
urls = ["/nha-dat-ban-masteri-grand-avenue"]

[[projects]]
name = "Lumiere Essence Peak"
urls = ["/nha-dat-ban-lumiere-essence-peak"]

[[projects]]
name = "Lumiere Prime Hills"
urls = ["/nha-dat-ban-lumiere-prime-hills"]

[[projects]]
name = "Imperia Signature"
urls = ["/nha-dat-ban-imperia-signature-co-loa"]
[projects.tower_options]
accent_insensitive = true
on_multiple = "blank"     # tin nêu nhiều tòa ("dự án gồm Y4, Y5, M1...") -> để trống, không đoán
[[projects.towers]]
pattern = '\b(?:toa|thap|block|building|tower)\s*[:\-]?\s*(y[45]|m[1-3])(?![a-z0-9])'
# Mã trần "căn Y4 góc". Tòa M2 trùng đơn vị "m2": loại "61,8m2", "90 m2", "tr/m2"
[[projects.towers]]
pattern = '(?<![a-z0-9./,])(?<!\d\s)(y[45]|m[1-3])(?![a-z0-9])(?!\s*/)'
[[projects.zones]]
pattern = '^Y'
value = "The Continental"
[[projects.zones]]
pattern = '^M'
value = "The Cosmopolitan"
[[projects.zones]]
on = "text"
pattern = 'continental'
value = "The Continental"
[[projects.zones]]
on = "text"
pattern = 'cosmopolit'
value = "The Cosmopolitan"
