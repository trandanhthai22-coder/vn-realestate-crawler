# Thuê shophouse / biệt thự / liền kề — 12 dự án Hải Phòng (thay cho DATA/fast_Scapling.py, DATA/fire_crawl.py)
# Bản cũ dùng Firecrawl; giờ mặc định chạy curl_cffi. Muốn dùng Firecrawl: --backend firecrawl + FIRECRAWL_API_KEY.
name = "Hải Phòng · Thuê thấp tầng đa dự án"
mode = "detail"
record = "lowrise_rent"
output = "hp_thue_thap_tang_da_du_an"

