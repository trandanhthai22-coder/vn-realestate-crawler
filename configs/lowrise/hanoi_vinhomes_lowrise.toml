# Giá bán thấp tầng (biệt thự / liền kề / shophouse) 6 KĐT Vinhomes Hà Nội
# (thay cho Data_Crawler/crawl_thấp_tầng 1.py)
#
# Chỉ đọc card trang danh mục -> nhanh. Đơn giá NO đất & hạ tầng = (tổng giá - DTXD × đơn giá xây dựng) / DT đất,
# chỉ tính khi tin nói rõ diện tích xây dựng / tổng sàn.
name = "Hà Nội · Thấp tầng Vinhomes"
mode = "lowrise"
output = "thap_tang_vinhomes"

[crawl]
days_back = 7
max_pages = 10
delay = 1.5
fetch_detail = false
stop_on_empty_page = false

[lowrise]
construction_rate = 8.0     # triệu đồng / m² sàn xây dựng

# Quy tắc phân loại [[projects.type_rules]]: xét theo thứ tự, khớp đầu tiên thắng.
#   zones = [...]            áp dụng cho các phân khu này (bỏ trống = mọi phân khu)
#   area_lt / area_lte / area_gt / area_gte   điều kiện diện tích đất (m²)
#   keep_types = [...]       nếu loại hình đọc được thuộc danh sách này thì giữ nguyên

# ──────────────────────────────────────────────────────────────────────────────
[[projects]]
name = "Vinhomes Ocean Park 1"
urls = ["/ban-nha-biet-thu-lien-ke-vinhomes-ocean-park-gia-lam"]
province = "Hà Nội"
district = "Gia Lâm"
aliases = ["vinhomes ocean park 1", "ocean park 1", "oceanpark 1", "vhop1", "vin 1 gia lam", "vinhomes ocean park gia lam"]
[projects.subdivisions]
"Hải Âu" = []
"Ngọc Trai" = ["đảo ngọc trai"]
"San Hô" = []
"Sao Biển" = []
[projects.code_prefixes]
"Hải Âu" = ["HA"]
"Ngọc Trai" = ["NT"]
"San Hô" = ["SH"]
"Sao Biển" = ["SB"]
[[projects.type_rules]]
zones = ["Sao Biển"]
area_lt = 70
type = "Liền kề"
[[projects.type_rules]]
zones = ["Sao Biển"]
area_gte = 70
type = "Biệt thự"
[[projects.type_rules]]
zones = ["Ngọc Trai", "San Hô"]
area_gt = 100
type = "Biệt thự"
[[projects.type_rules]]
zones = ["Hải Âu"]
area_lt = 100
type = "Liền kề"
[[projects.type_rules]]
zones = ["Hải Âu"]
area_gt = 150
type = "Biệt thự"

