[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vn-realestate-crawler"
version = "0.1.0"
description = "Config-driven crawler for Vietnamese real-estate listing sites (batdongsan.com.vn, ...) with Excel export."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MKTRS Intern team" }]
keywords = ["crawler", "scraper", "real-estate", "batdongsan", "vietnam", "cloudflare"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Natural Language :: Vietnamese",
]
dependencies = [
    "beautifulsoup4>=4.12",
    "curl_cffi>=0.13",
    "pandas>=2.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
# Mở trình duyệt thật để lấy cookie cf_clearance khi batdongsan bật Cloudflare challenge
browser = ["DrissionPage>=4.1"]
# Backend fetch qua dịch vụ Firecrawl (cần FIRECRAWL_API_KEY)
firecrawl = ["firecrawl-py>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
bdscrawl = "bdscrawler.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
